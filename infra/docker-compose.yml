version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smarthome-mosquitto
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - smarthome-network

volumes:
  mosquitto_data:
  mosquitto_log:

networks:
  smarthome-network:
    driver: bridge
